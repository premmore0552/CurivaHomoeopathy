[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  CLOUDFLARE_ZONE_ID = "dummy_zone_id_placeholder_to_bypass_build"
  CLOUDFLARE_API_KEY = "dummy_api_key_placeholder_to_bypass_build"
  CLOUDFLARE_EMAIL = "dummy_email_placeholder@example.com"
  CLOUDFLARE_API_TOKEN = "dummy_api_token_placeholder_to_bypass_build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://picsum.photos https://images.unsplash.com https://curivahomoeopathy.netlify.app; connect-src 'self' https://lumberjack-cx.razorpay.com; frame-src https://api.razorpay.com;"
