[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  CLOUDFLARE_ZONE_ID = "dummy_zone_id_placeholder_to_bypass_build"
  CLOUDFLARE_API_KEY = "dummy_api_key_placeholder_to_bypass_build"
  CLOUDFLARE_EMAIL = "dummy_email_placeholder@example.com"
  CLOUDFLARE_API_TOKEN = "dummy_api_token_placeholder_to_bypass_build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "serverless-http", "lightningcss", "vite", "esbuild"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "0"
    X-Content-Type-Options = "nosniff"
    X-Permitted-Cross-Domain-Policies = "none"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://api.razorpay.com https://checkout.razorpay.com; script-src 'self' https://checkout.razorpay.com https://checkout-static.razorpay.com https://www.google.com https://www.gstatic.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://checkout.razorpay.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com wss://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.razorpay.com https://www.google.com https://www.gstatic.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://checkout-static.razorpay.com https://accounts.google.com https://www.google.com https://www.gstatic.com https://www.recaptcha.net https://*.firebaseapp.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; upgrade-insecure-requests"


# Allow the native Capacitor WebView to fetch self-hosted live-update metadata and bundles.
[[headers]]
  for = "/live-updates/latest.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/live-updates/bundles/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/zip"
