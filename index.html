    <!-- Performance Optimizations -->
    <script>
      (function() {
        var saved = localStorage.getItem('theme');
        var theme = 'light';
        if (saved === 'light' || saved === 'dark') {
          theme = saved;
        } else {
          var hour = new Date().getHours();
          theme = (hour >= 6 && hour < 18) ? 'light' : 'dark';
        }
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Clear old caches and unregister service workers on version change to avoid blank screen / stale chunk assets
      const APP_VERSION = '__CURIVA_BUILD_VERSION__';
      const isDev = window.location.hostname === 'localhost' || window.location.hostname.includes('ais-dev') || window.location.hostname.includes('ais-pre');

      if (isDev) {
        // In development/preview sandbox, we strictly unregister the service worker to prevent source file caching
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (let reg of registrations) {
              reg.unregister().then(() => {
                console.log('Unregistered service worker for development environment.');
              });
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(key => caches.delete(key));
          });
        }
        localStorage.setItem('app_version', APP_VERSION);
      } else if (localStorage.getItem('app_version') !== APP_VERSION) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (let reg of registrations) {
              reg.unregister().then(() => {
                console.log('Unregistered active service worker to clear cache.');
              });
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(key => caches.delete(key));
          });
        }
        localStorage.setItem('app_version', APP_VERSION);
        console.log('System cache busted to version: ' + APP_VERSION);
        
        // Short delay to allow cleanup, then reload to guarantee completely fresh assets
        setTimeout(function() {
          window.location.reload();
        }, 300);
      } else {
        // Register service worker if supported
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js')
              .then(function(reg) {
                console.log('Service Worker registered with scope:', reg.scope);
              })
              .catch(function(err) {
                console.error('Service Worker registration failed:', err);
              });
          });
        }
      }
    </script>
  </body>
