name: Verify Curiva web and app runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-curiva-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-web-build:
    name: Typecheck and build shared frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build production website assets
        run: npm run build
