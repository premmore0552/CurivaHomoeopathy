name: Verify Curiva website and app assets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-curiva-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build website, and validate free OTA bundle
    runs-on: ubuntu-latest
    env:
      COMMIT_REF: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm

      - name: Regenerate lockfile from package manifest
        if: github.event_name == 'pull_request' && github.head_ref == 'security/issue-46-netlify-deploy-fix'
        run: rm -f package-lock.json && npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Report locked dependency security advisories
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require('node:fs');
          let report = {};
          try {
            report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          } catch (error) {
            console.log('npm audit report could not be parsed:', error.message);
            process.exit(0);
          }
          const entries = Object.entries(report.vulnerabilities || {});
          console.log('NPM_AUDIT_COUNTS', JSON.stringify(report.metadata?.vulnerabilities || {}));
          for (const [name, item] of entries) {
            const advisories = (item.via || [])
              .filter((entry) => typeof entry === 'object')
              .map((entry) => [entry.title, entry.range, entry.url].filter(Boolean).join(' | '))
              .join('; ');
            console.log(
              `NPM_AUDIT ${String(item.severity).toUpperCase()} ${name} range=${item.range} direct=${item.isDirect} fix=${JSON.stringify(item.fixAvailable)} advisories=${advisories}`,
            );
          }
          if (report.error) console.log('NPM_AUDIT_ERROR', JSON.stringify(report.error));
          NODE

      - name: Report production-only npm security advisories
        shell: bash
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit-production.json" || true
          node - "$RUNNER_TEMP/npm-audit-production.json" <<'NODE'
          const fs = require('node:fs');
          let report = {};
          try {
            report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          } catch (error) {
            console.log('Production-only npm audit report could not be parsed:', error.message);
            process.exit(0);
          }
          console.log('NPM_AUDIT_PRODUCTION_COUNTS', JSON.stringify(report.metadata?.vulnerabilities || {}));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log(
              `NPM_AUDIT_PRODUCTION ${String(item.severity).toUpperCase()} ${name} range=${item.range} fix=${JSON.stringify(item.fixAvailable)}`,
            );
          }
          NODE
      - name: Verify Boericke source reconciliation and importer
        run: npm run test:boericke
      - name: Test native study-plan validation
        run: npm run test:native-progress
      - name: Test conflict-safe study workspace sync
        run: npm run test:study-toolkit-sync
      - name: Test complete UPSC and MD question-bank import
        run: npm run test:chauhan-question-bank

      - name: Test Google authentication recovery and error messages
        run: npm run test:auth

      - name: Verify NCH year-wise Organon curriculum coverage
        run: npm run test:organon-curriculum

      - name: Typecheck
        run: npm run lint

      - name: Build website and self-hosted app update bundle
        run: npm run build

      - name: Ensure server-only Node bundle stays outside the public site
        run: |
          test -s .server-build/server.cjs
          test ! -e dist/server.cjs
          test ! -e dist/server.cjs.map

      - name: Verify disease asset partition fidelity
        run: npm run test:disease-assets

      - name: Enforce client bundle budgets
        run: node scripts/check-bundle-budgets.mjs

      - name: Validate OTA ZIP and manifest
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(find dist/live-updates/bundles -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$bundle"
          unzip -t "$bundle"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const manifest = JSON.parse(fs.readFileSync('dist/live-updates/latest.json', 'utf8'));
          const files = fs.readdirSync('dist/live-updates/bundles').filter((name) => name.endsWith('.zip'));
          if (files.length !== 1) throw new Error('Expected exactly one current OTA zip in a clean build');
          const zip = fs.readFileSync(`dist/live-updates/bundles/${files[0]}`);
          const checksum = crypto.createHash('sha256').update(zip).digest('hex');
          if (manifest.checksum !== checksum) throw new Error('OTA manifest checksum mismatch');
          if (manifest.bundleId !== files[0].replace(/\.zip$/, '')) throw new Error('OTA manifest bundle ID mismatch');
          console.log(`Verified OTA bundle ${manifest.bundleId}`);
          NODE
          if unzip -Z1 "$bundle" | grep -Eq '(^|/)server\.cjs(\.map)?$'; then
            echo "Server-only Express artifact must not be included in the mobile bundle."
            exit 1
          fi

      - name: Bundle the Netlify API function and private-download helpers
        run: |
          npx esbuild netlify/functions/api.ts --bundle --platform=node --format=esm --packages=external --outfile=.netlify-build/functions/api.mjs
          mkdir -p .netlify-build/server
          npx esbuild src/server/paidOrderStore.ts --bundle --platform=node --format=esm --packages=external --outfile=.netlify-build/server/paidOrderStore.mjs
          npx esbuild src/server/resourceEmail.ts --bundle --platform=node --format=esm --packages=external --outfile=.netlify-build/server/resourceEmail.mjs
          npx esbuild src/server/clinicCalendar.ts --bundle --platform=node --format=esm --packages=external --outfile=.netlify-build/server/clinicCalendar.mjs

      - name: Verify navigation, private downloads, and Netlify API
        run: node --test tests/navigation.routes.test.mjs tests/netlify-api.test.mjs tests/private-downloads.test.mjs tests/clinic-calendar.test.mjs tests/native-branding.test.mjs

      - name: Verify compact initial medical disclaimer banner
        run: node --test tests/medical-disclaimer-banner.test.mjs tests/floating-controls-layout.test.mjs

      - name: Verify deferred-data loading boundaries
        run: node --test tests/performance-loading.test.mjs

      - name: Verify public-health content, privacy disclosure, and branding
        run: node --test tests/public-health-content.test.mjs

      - name: Verify privacy, CSP, storage and AI security boundaries
        run: npm run test:privacy-security

      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install temporary Firestore rules test tools
        run: npm install --no-save --package-lock=false firebase-tools @firebase/rules-unit-testing@6.0.0

      - name: Test Firestore security rules in the emulator
        run: npx firebase emulators:exec --only firestore --project demo-curiva-firestore-rules "node --test tests/firestore.rules.test.mjs"

      - name: Smoke-test the live Netlify Deploy Preview
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '[skip netlify]')
        run: npm run verify:deploy-preview -- "https://deploy-preview-${{ github.event.pull_request.number }}--curivahomoeopathy.netlify.app"

  safe-dependency-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'security/issue-46-netlify-deploy-fix'
    name: Apply available non-forced npm security updates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the Phase 2 pull-request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm

      - name: Refresh package lock for selected safe versions
        run: rm -f package-lock.json && npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Apply npm audit fixes without forcing major upgrades
        continue-on-error: true
        run: npm audit fix

      - name: Report remaining dependency advisories
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit-after-fix.json" || true
          node - "$RUNNER_TEMP/npm-audit-after-fix.json" <<'NODE'
          const fs = require('node:fs');
          let report = {};
          try {
            report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          } catch (error) {
            console.log('Post-fix npm audit report could not be parsed:', error.message);
            process.exit(0);
          }
          console.log('POST_FIX_NPM_AUDIT_COUNTS', JSON.stringify(report.metadata?.vulnerabilities || {}));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            const advisories = (item.via || [])
              .filter((entry) => typeof entry === 'object')
              .map((entry) => [entry.title, entry.range, entry.url].filter(Boolean).join(' | '))
              .join('; ');
            console.log(
              `POST_FIX_NPM_AUDIT ${String(item.severity).toUpperCase()} ${name} range=${item.range} fix=${JSON.stringify(item.fixAvailable)} advisories=${advisories}`,
            );
          }
          NODE

      - name: Block critical npm advisories
        run: npm audit --audit-level=high

      - name: Commit safe dependency lockfile updates
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "npm audit fix produced no lockfile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: update vulnerable npm dependency versions"
          git push origin "HEAD:${HEAD_REF}"
