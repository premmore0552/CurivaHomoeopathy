name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js for the native Android build
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for the native Android build
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Android Gradle is generated during CI rather than committed. Prepare
      # it before the manual build so Kotlin extraction sees the Compose app.
      - name: Regenerate lockfile from package manifest
        if: matrix.language == 'java-kotlin' && github.event_name == 'pull_request' && github.head_ref == 'security/issue-46-netlify-deploy-fix'
        run: rm -f package-lock.json && npm install --package-lock-only --ignore-scripts

      - name: Install JavaScript and TypeScript dependencies
        if: matrix.language == 'java-kotlin'
        run: npm ci

      - name: Typecheck shared learning sources
        if: matrix.language == 'java-kotlin'
        run: npm run lint

      - name: Build shared source for Android project generation
        if: matrix.language == 'java-kotlin'
        run: npm run build
        env:
          COMMIT_REF: ${{ github.sha }}

      - name: Generate the Android Gradle project
        if: matrix.language == 'java-kotlin'
        run: |
          rm -rf android
          npm run cap:add

      - name: Export offline Android learning content
        if: matrix.language == 'java-kotlin'
        run: npm run export:native-content

      - name: Configure standalone Jetpack Compose app
        if: matrix.language == 'java-kotlin'
        run: node scripts/apply-native-android.mjs

      - name: Verify native Android project
        if: matrix.language == 'java-kotlin'
        run: node scripts/verify-native-android.mjs

      - name: Build Android app for Kotlin extraction
        if: matrix.language == 'java-kotlin'
        working-directory: android
        run: ./gradlew --no-daemon :app:compileDebugKotlin

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
