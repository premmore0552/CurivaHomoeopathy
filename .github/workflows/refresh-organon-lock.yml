name: Reconcile npm lockfile for CI

on:
  push:
    branches:
      - fix/ci-dependency-sync

permissions:
  contents: write

concurrency:
  group: reconcile-npm-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Node.js required by the selected dependencies
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm

      - name: Regenerate lockfile from the dependency manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean dependency installation
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Validate protected Organon source and curriculum
        run: npm run test:organon-curriculum

      - name: Commit the regenerated lockfile after validation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: synchronize npm lockfile with accepted dependency versions"
          git push origin "HEAD:fix/ci-dependency-sync"
