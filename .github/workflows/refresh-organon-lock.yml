name: Refresh Organon PR npm lockfile

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: organon-lock-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.head_ref == 'feat/organon-content-preservation-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Organon preparation branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm

      - name: Regenerate package-lock.json from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify a clean locked dependency installation
        run: npm ci --no-audit --no-fund

      - name: Commit the reconciled lockfile
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: regenerate npm lockfile from package manifest"
          git push origin "HEAD:${HEAD_REF}"
