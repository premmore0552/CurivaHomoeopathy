name: Reconcile npm lockfile for CI

on:
  push:
    branches:
      - fix/ci-install-and-codeql-node

permissions:
  contents: write

concurrency:
  group: reconcile-npm-lockfile
  cancel-in-progress: false

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up the Node.js version required by locked dependencies
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm

      - name: Regenerate package lock from the declared dependency ranges
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Prove a clean dependency installation works
        run: npm ci --no-audit --no-fund

      - name: Typecheck the repository
        run: npm run lint

      - name: Verify Organon curriculum and protected aphorism source
        run: npm run test:organon-curriculum

      - name: Commit regenerated lockfile only after clean install and tests pass
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "The existing lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: synchronize npm lockfile and dependency tree"
          git push origin "HEAD:fix/ci-install-and-codeql-node"
