name: Build Curiva Android test APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'scripts/**'
      - '.github/workflows/build-android-debug.yml'

permissions:
  contents: read

concurrency:
  group: curiva-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Build installable Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install web dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build shared website and OTA assets
        run: npm run build
        env:
          COMMIT_REF: ${{ github.sha }}

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            npm run cap:add
          fi
          npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: curiva-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
