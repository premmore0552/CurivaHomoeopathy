# SonarQube analysis is enabled when the repository is configured.
#
# Required repository settings:
#   Variable: SONAR_PROJECT_KEY
#   Secret:   SONAR_TOKEN
#   Secret:   SONAR_HOST_URL
#
# If any setting is missing, the workflow records a notice and safely skips the
# scanner instead of invoking it with an empty project key.

name: SonarQube analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  Analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Check SonarQube configuration
        id: sonar-config
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$SONAR_TOKEN" ]] || missing+=("SONAR_TOKEN secret")
          [[ -n "$SONAR_HOST_URL" ]] || missing+=("SONAR_HOST_URL secret")
          [[ -n "$SONAR_PROJECT_KEY" ]] || missing+=("SONAR_PROJECT_KEY repository variable")

          if (( ${#missing[@]} > 0 )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SonarQube scan skipped. Add the following repository settings to enable it: ${missing[*]}."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "SonarQube configuration is present."
          fi

      - name: Check out source
        if: steps.sonar-config.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Analyze with SonarQube
        if: steps.sonar-config.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@7295e71c9583053f5bf40e9d4068a0c974603ec8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
