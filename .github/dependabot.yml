version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    groups:
      npm-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "security"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    groups:
      actions-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "security"
